services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_PATH: /data/bgi.sqlite3
      DEMO_MODE: "1"
      DEMO_ALLOWED_HOSTS: localhost,127.0.0.1,::1,testserver,api
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      COOKIE_SECURE: "0"
    volumes:
      - bgi-data:/data
  web:
    build: .
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  bgi-data:
